<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Greenware routes a website form through Clay</title>
  <desc id="desc">A visitor submits an existing website form, Greenware sends the lead to Clay, and the form receives the next action Clay selected.</desc>
  <rect width="960" height="500" rx="20" fill="#f6f8fa"/>
  <rect x="28" y="28" width="904" height="444" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="54" cy="54" r="6" fill="#ff7b72"/><circle cx="74" cy="54" r="6" fill="#f2cc60"/><circle cx="94" cy="54" r="6" fill="#56d364"/>
  <rect x="124" y="43" width="420" height="22" rx="11" fill="#eef1f4"/>

  <rect x="58" y="100" width="250" height="324" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="78" y="122" width="210" height="34" rx="7" fill="#f6f8fa"/>
  <text x="183" y="144" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#24292f">Website form</text>
  <rect x="78" y="174" width="210" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="92" y="195" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8c959f">Work email</text>
  <rect x="78" y="220" width="210" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="92" y="241" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8c959f">Company</text>
  <rect x="78" y="270" width="210" height="36" rx="8" fill="#24292f"/>
  <text x="183" y="293" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Submit form</text>
  <rect x="78" y="324" width="210" height="42" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="183" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#116329">Booking calendar appears</text>
  <text x="183" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#116329">for a qualified lead</text>
  <text x="183" y="402" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#24292f">1. Submit lead</text>

  <path d="M324 240h48" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m362 230 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="388" y="100" width="210" height="324" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="420" cy="132" r="16" fill="#86efac"/><circle cx="438" cy="132" r="16" fill="#4ade80"/><circle cx="429" cy="148" r="16" fill="#16a34a"/>
  <text x="493" y="140" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#24292f">Greenware</text>
  <rect x="410" y="174" width="166" height="38" rx="8" fill="#24292f"/>
  <text x="493" y="198" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" fill="#ffffff">POST /api/submit</text>
  <rect x="410" y="232" width="166" height="70" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="493" y="255" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">Create session</text>
  <text x="493" y="276" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">Wait for Clay</text>
  <text x="493" y="291" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#57606a">signed callback + read token</text>
  <rect x="410" y="324" width="166" height="42" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="493" y="350" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#116329">render action</text>
  <text x="493" y="402" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#24292f">2. Route + wait</text>

  <path d="M614 240h48" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><path d="m652 230 12 10-12 10" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="678" y="100" width="224" height="324" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="698" y="122" width="184" height="34" rx="7" fill="#f6f8fa"/>
  <text x="790" y="144" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#24292f">Clay</text>
  <rect x="698" y="174" width="184" height="36" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="698" y="210" width="184" height="36" fill="#ddf4ff" stroke="#54aeff"/>
  <rect x="698" y="246" width="184" height="36" fill="#ffffff" stroke="#d8dee4"/>
  <path d="M760 174v108M824 174v108" stroke="#d8dee4"/>
  <circle cx="714" cy="228" r="6" fill="#0969da"/>
  <rect x="728" y="223" width="112" height="9" rx="4" fill="#54aeff" opacity=".55"/>
  <rect x="698" y="300" width="184" height="66" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="790" y="323" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#633c01">Enrich + qualify</text>
  <text x="790" y="343" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#633c01">action: embed</text>
  <text x="790" y="359" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#633c01">cal.com/enterprise</text>
  <text x="790" y="402" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#24292f">3. Enrich + decide</text>

  <text x="348" y="323" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1a7f37">action</text>
  <path d="M372 340h-48" stroke="#2ea44f" stroke-width="3" stroke-linecap="round"/>
  <path d="m334 330-12 10 12 10" fill="none" stroke="#2ea44f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="638" y="323" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1a7f37">callback</text>
  <path d="M662 340h-48" stroke="#2ea44f" stroke-width="3" stroke-linecap="round"/>
  <path d="m624 330-12 10 12 10" fill="none" stroke="#2ea44f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
